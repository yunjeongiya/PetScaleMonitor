name: ICLR split-panel tie-sensitivity audit

on:
  push:
    branches:
      - trc-43-candidate-screen
    paths:
      - candidate_experiments/iclr_tie_sensitivity.py
      - .github/workflows/trc_iclr_tie_audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pandas scipy tabulate
      - name: Download prior successful candidate artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10048991677/zip" -o candidate.zip
          mkdir artifact
          unzip -q candidate.zip -d artifact
      - name: Run tie sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python candidate_experiments/iclr_tie_sensitivity.py --input-dir artifact --output-dir iclr_tie_results --seeds 50 --random-tie-reps 20
      - name: Build QA and report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd, json
          s=pd.read_csv('iclr_tie_results/iclr_tie_sensitivity_summary.csv')
          checks={
            'at_least_two_years':s.year.nunique()>=2,
            'large_universe':s['n'].min()>=200,
            'tie_rule_mean_below_0_02':s.tie_rule_diff_mean.max()<.02,
            'random_tie_sd_mean_below_0_02':s.random_tie_sd_mean.max()<.02,
          }
          report=['# ICLR split-panel tie-sensitivity audit','',s.to_markdown(index=False),'','## QA','',json.dumps(checks,indent=2)]
          Path('iclr_tie_results/RESULTS_REPORT.md').write_text('\n'.join(report),encoding='utf-8')
          Path('iclr_tie_results/QA_STATUS.json').write_text(json.dumps({'all_pass':all(checks.values()),'checks':checks},indent=2),encoding='utf-8')
          PY
      - name: Commit compact report
        shell: bash
        run: |
          set -euo pipefail
          rm -rf candidate_report_iclr_ties
          mkdir candidate_report_iclr_ties
          cp iclr_tie_results/RESULTS_REPORT.md iclr_tie_results/QA_STATUS.json iclr_tie_results/iclr_tie_sensitivity_summary.csv iclr_tie_results/metadata.json candidate_report_iclr_ties/
          sha256sum candidate_report_iclr_ties/* > candidate_report_iclr_ties/SHA256SUMS.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add candidate_report_iclr_ties
          git commit -m "[skip ci] Publish ICLR tie-sensitivity audit"
          git push origin HEAD:trc-43-candidate-screen
      - name: Upload full audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trc-iclr-tie-sensitivity
          path: iclr_tie_results
          if-no-files-found: warn
          compression-level: 6
